<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <radialGradient id="glow-purple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-cyan" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-blue" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Patterns & Filters -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#334155" opacity="0.6"/>
    </pattern>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-9px); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
      .anim-glow-1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .anim-glow-2 {
        transform-origin: 1000px 250px;
        animation: pulseGlow 9s ease-in-out infinite 1s;
      }
      .anim-float-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .anim-float-2 {
        animation: floatFast 6s ease-in-out infinite 0.7s;
      }
      .anim-float-3 {
        animation: floatSlow 5.5s ease-in-out infinite 1.4s;
      }
      .data-stream {
        stroke-dasharray: 6 6;
        animation: dashFlow 2.5s linear infinite;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Grid Overlay -->
  <rect width="1200" height="360" rx="16" fill="url(#grid-pattern)"/>

  <!-- Ambient Glowing Orbs (Dynamic Background) -->
  <circle class="anim-glow-1" cx="220" cy="110" r="240" fill="url(#glow-purple)"/>
  <circle class="anim-glow-2" cx="980" cy="220" r="260" fill="url(#glow-cyan)"/>
  <circle cx="600" cy="180" r="300" fill="url(#glow-blue)"/>

  <!-- Dynamic Network Data Streams (Background layer) -->
  <g opacity="0.35">
    <path class="data-stream" d="M 80 80 Q 250 20 420 80 T 800 80 T 1120 120" stroke="#06b6d4" stroke-width="1.8" fill="none"/>
    <path class="data-stream" d="M 120 280 Q 300 320 500 270 T 900 290 T 1140 240" stroke="#a855f7" stroke-width="1.8" fill="none"/>
    <path class="data-stream" d="M 950 40 C 1050 120 1020 220 1120 300" stroke="#3b82f6" stroke-width="1.5" fill="none"/>
    <path class="data-stream" d="M 60 160 C 180 200 160 300 280 320" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Left Futuristic Card: Inbox & Intelligence -->
  <g class="anim-float-1" transform="translate(60, 55)" filter="url(#card-shadow)">
    <rect width="130" height="110" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <!-- Email Envelope Icon -->
    <rect x="25" y="25" width="80" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 27 27 L 65 54 L 103 27" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
    <circle cx="95" cy="30" r="4" fill="#22c55e"/>
    <text x="65" y="94" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">AGENT INBOX</text>
  </g>

  <!-- Right Futuristic Card: Autonomous Pipeline -->
  <g class="anim-float-2" transform="translate(1010, 60)" filter="url(#card-shadow)">
    <rect width="130" height="110" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <!-- Terminal / Code Badge -->
    <rect x="25" y="24" width="80" height="52" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="36" cy="34" r="2.5" fill="#ef4444"/>
    <circle cx="44" cy="34" r="2.5" fill="#eab308"/>
    <circle cx="52" cy="34" r="2.5" fill="#22c55e"/>
    <text x="36" y="58" class="font-sans" font-size="11" font-weight="700" fill="#a855f7">&gt;_</text>
    <path d="M 52 56 L 85 56" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 36 66 L 70 66" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
    <text x="65" y="94" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">MCP / API</text>
  </g>

  <!-- FOREGROUND: Main Branding Header (Prominent & Clear) -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Top Category Eyebrow Pill -->
    <g transform="translate(0, -38)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="-118" cy="0" r="4" fill="#38bdf8"/>
      <text x="0" y="4.5" class="font-sans" font-size="11.5" font-weight="700" fill="#7dd3fc" letter-spacing="1.2">CURATED AGENT ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text y="30" class="font-sans" font-size="44" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5">
      Awesome Agent-Native Inbox
    </text>

    <!-- Subtitle -->
    <text y="68" class="font-sans" font-size="16.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Programmatic Inboxes • Autonomous Email APIs • Deterministic Security • MCP Ecosystem
    </text>
  </g>

  <!-- FOREGROUND: Dynamic Feature Pills (Guaranteed Below Title, Never Obstructing) -->
  <g class="anim-float-3" transform="translate(600, 240)">
    <!-- Pill 1: Programmatic Email -->
    <g transform="translate(-370, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="0" y="4" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#93c5fd">📬 Programmatic Inboxes</text>
    </g>

    <!-- Pill 2: AI Agents -->
    <g transform="translate(-180, 0)">
      <rect x="-75" y="-16" width="150" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="0" y="4" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#67e8f9">🤖 AI Agents</text>
    </g>

    <!-- Pill 3: MCP Ready -->
    <g transform="translate(0, 0)">
      <rect x="-65" y="-16" width="130" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.2"/>
      <text x="0" y="4" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#d8b4fe">⚡ MCP Native</text>
    </g>

    <!-- Pill 4: Security Gates -->
    <g transform="translate(180, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-width="1.2"/>
      <text x="0" y="4" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#6ee7b7">🛡️ Capability Gating</text>
    </g>

    <!-- Pill 5: Open Infrastructure -->
    <g transform="translate(370, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="0" y="4" text-anchor="middle" class="font-sans" font-size="12" font-weight="600" fill="#fcd34d">🌐 Open Infrastructure</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#cyan-blue)" opacity="0.8"/>
</svg>
